server.port=9000

# Login session at the provider, as long as the tokens are valid.
server.servlet.session.timeout=3h

# The same H2 database as the main application (users table). AUTO_SERVER lets both applications use the file
# at the same time.
spring.datasource.url=jdbc:h2:file:~/jee-aquarium-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=sa
