<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="id" value="#{fishEdit.id}"/>
            <f:viewAction action="#{fishEdit.init}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="title">Edycja ryby</ui:define>

    <ui:define name="content">
        <section>
            <h1>Edycja ryby: #{fishEdit.fish.species}</h1>
            <ui:include src="/WEB-INF/include/fish_form.xhtml">
                <ui:param name="bean" value="#{fishEdit}"/>
            </ui:include>
        </section>
    </ui:define>

</ui:composition>
